services:
  - type: web
    name: d-table-analytics-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://d-table-analytics-drog.vercel.app
      - key: USE_MEMORY_DB
        value: "false"
      - key: AUTO_SEED
        value: "false"
      - key: ALLOW_MEMORY_FALLBACK
        value: "false"
